server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name fras.42.fr;

    # SSL/TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/ssl/fras.crt;
    ssl_certificate_key /etc/nginx/ssl/fras.key;

    # Set the web root to the WordPress volume
    root /var/www/html;
    index index.php index.html;

    # Handle static files directly
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Pass PHP scripts to the WordPress (PHP-FPM) container
    location ~ \.php$ {
        include fastcgi_params;
        # 'wordpress:9000' is the service name and port
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
